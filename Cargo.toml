[package]
name = "orderup"
version = "0.1.2"
edition = "2024"
description = "Order Up: a double press of the reception bell launches an AutoHotkey script"

[dependencies]
cpal = "0.18.2"
realfft = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Tuned for the smallest resident footprint: this runs forever in the background.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = ["Win32_System_Registry", "Win32_Foundation"] }
